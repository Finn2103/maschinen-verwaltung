# monitor.conf – Konfiguration für das Server-Monitoring (#14, ADR 0012)
# Keine Zugangsdaten und keine Webhook-URLs im Repository hinterlegen.

# === 1. Takt & Prüfmodule ===
INTERVAL=10
CHECKS="system docker services endpoints"
COLLECT_TIMEOUT=25
LOG_LEVEL=INFO

# === 2. Schwellwerte (WARNING ERROR CRITICAL, "-" = deaktiviert) ===
CPU_THRESHOLDS="85 95 -"
MEMORY_THRESHOLDS="85 95 98"
DISK_THRESHOLDS="80 90 95"
LOAD_THRESHOLDS="2 4 -"
DISK_PATHS="auto"

# === 3. Docker & automatische Port-Prüfung ===
DOCKER_SOCKET="/var/run/docker.sock"
CRITICAL_CONTAINERS="supabase-db supabase-kong supabase-pooler mailserver"
PORT_CHECKS="auto"
PORT_TIMEOUT=5

# === 4. Systemdienste (systemd) ===
SERVICES="docker ssh cron"
CRITICAL_SERVICES="docker"

# === 5. Externe Schnittstellen (ohne Passwörter) ===
ENDPOINTS='[
  {"name":"vies-status","method":"GET","url":"https://ec.europa.eu/taxation_customs/vies/rest-api/check-status","expect":200,"timeout":10,"level":"WARNING","slow_ms":5000},
  {"name":"vies-ustid","method":"POST","url":"https://ec.europa.eu/taxation_customs/vies/rest-api/check-vat-test-service","headers":{"Content-Type":"application/json"},"body":"{\"countryCode\":\"DE\",\"vatNumber\":\"100\"}","expect":200,"timeout":10,"level":"WARNING"}
]'

# === 6. Alarmierung, Spam-Schutz & Berichte ===
CONFIRM_CYCLES=2
NOTIFY_WINDOW=600
NOTIFY_MAX=2
REPORT_INTERVAL=3600
WEBHOOKS='[]'
