
---
- name: Docker Paketlisten aktualisieren
  ansible.builtin.apt:
    update_cache: true

- name: Docker und Docker Compose installieren
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present

- name: Docker Dienst aktivieren und starten
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
